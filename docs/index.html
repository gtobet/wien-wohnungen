<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wohnungen Wien</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
      </span>
      <div>
        <h1>Wohnungen Wien</h1>
        <p id="meta" class="meta">Lade Daten …</p>
      </div>
    </div>
    <div id="sources" class="sources" aria-label="Plattformen"></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button type="button" id="filterToggle" class="filter-toggle" aria-expanded="false" aria-controls="filters">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      Filter
      <span id="filterSummary" class="filter-summary"></span>
    </button>

    <form id="filters" class="filters" autocomplete="off">
      <section class="group">
        <h2>Eckdaten</h2>
        <div class="fields">
          <label class="field">
            <span>Miete bis</span>
            <span class="input-wrap"><input type="number" name="maxPrice" inputmode="numeric" step="10" min="0"><em>€</em></span>
          </label>
          <label class="field">
            <span>Fläche ab</span>
            <span class="input-wrap"><input type="number" name="minArea" inputmode="numeric" step="1" min="0"><em>m²</em></span>
          </label>
          <label class="field">
            <span>Zimmer ab</span>
            <span class="input-wrap"><input type="number" name="minRooms" inputmode="numeric" step="1" min="1"></span>
          </label>
        </div>
      </section>

      <section class="group">
        <h2>Bezirke</h2>
        <div id="districts" class="district-grid"></div>
      </section>

      <section class="group">
        <h2>Ausstattung &amp; Anzeige</h2>
        <label class="switch"><input type="checkbox" name="outdoorOnly"><span class="track"></span>Nur mit Balkon, Terrasse oder Freifläche</label>
        <label class="switch"><input type="checkbox" name="hideSwap"><span class="track"></span>Tausch- und Wohnticket-Angebote ausblenden</label>
        <label class="switch"><input type="checkbox" name="includeUnknown"><span class="track"></span>Angebote ohne Preis- oder Flächenangabe zeigen</label>
        <label class="switch"><input type="checkbox" name="favOnly"><span class="track"></span>Nur gemerkte</label>
        <label class="switch"><input type="checkbox" name="showHidden"><span class="track"></span>Ausgeblendete zeigen</label>
      </section>

      <section class="group">
        <h2>Plattformen</h2>
        <div id="platforms" class="chips"></div>
      </section>

      <button type="button" id="reset" class="reset">Auf meine Kriterien zurücksetzen</button>
    </form>
  </aside>

  <main class="results">
    <div class="results-head">
      <p id="count" class="count"></p>
      <label class="sort">
        <span>Sortieren</span>
        <select name="sort" form="filters">
          <option value="new">Neueste zuerst</option>
          <option value="price">Preis aufsteigend</option>
          <option value="sqm">Preis pro m²</option>
          <option value="area">Größte zuerst</option>
        </select>
      </label>
    </div>
    <ul id="list" class="grid"></ul>
    <button type="button" id="more" class="more" hidden>Weitere Angebote anzeigen</button>
    <p class="note">Preise wie auf der Plattform angegeben, je nach Inserat Kalt- oder Gesamtmiete. Daten werden mehrmals täglich automatisch aktualisiert, nur für den privaten Gebrauch.</p>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
