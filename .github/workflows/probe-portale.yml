name: probe-portale
on:
  push:
    branches: [claude/probe-portale]
    paths: [probe-urls.txt]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf probe; mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          i=0
          while read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1))
            code=$(curl -sSL --max-time 30 -A "$UA" -H "Accept-Language: de-AT,de;q=0.9" -o "probe/$i.html" -w "%{http_code} %{url_effective} %{size_download}" "$u" 2>&1 || true)
            echo "$i $u -> $code" >> probe/index.txt
            sleep 1
          done < probe-urls.txt
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add probe && git commit -m probe && git push
